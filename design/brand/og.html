<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#FFFFFF;font-family:'JetBrains Mono',monospace}
.wrap{box-sizing:border-box;width:1200px;height:630px;padding:56px 64px;display:flex;align-items:center;gap:48px}
.win{flex:1;background:#16161E;border:1px solid #2A2B3D;border-radius:16px;overflow:hidden;box-shadow:6px 14px 32px rgba(0,0,0,.28);color:#C0CAF5}
.bar{display:flex;align-items:center;gap:10px;padding:16px 20px;background:#1F2030;border-bottom:1px solid #2A2B3D}
.dot{width:16px;height:16px;border-radius:50%}
.t{flex:1;text-align:center;margin-right:78px;font-size:18px;color:#A9B1D6}
.body{padding:28px 32px 34px;font-size:23px;line-height:1.6}
.g{color:#9ECE6A}.b{color:#7AA2F7}.a{color:#E0AF68}.m{color:#A9B1D6}.w{color:#FFFFFF;font-weight:700;font-size:38px}
.cur{display:inline-block;width:14px;height:28px;background:#C0CAF5;vertical-align:-4px;margin-left:4px}
.side{width:250px;display:flex;flex-direction:column;align-items:center;gap:22px}
.side img{width:230px;height:230px;border-radius:50%;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.url{font-size:17px;color:#4B5563;white-space:nowrap}
</style></head><body><div class="wrap">
<div class="win"><div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span class="t">~/josh-rochon</span></div>
<div class="body">
<div><span class="g">josh</span> <span class="b">~</span> $ whoami</div>
<div class="w">Josh Rochon</div>
<div>Senior Software Engineer · Seattle</div>
<div class="m">7 yrs · Starbucks · Microsoft · BECU · Gauntlet AI</div>
<div style="margin-top:14px"><span class="g">josh</span> <span class="b">~</span> $ ls projects/</div>
<div class="a">keyblaster/  ship/  silent-flow/  +8 more</div>
<div><span class="g">josh</span> <span class="b">~</span> $<span class="cur"></span></div>
</div></div>
<div class="side"><img src="photo.jpg" alt=""><div class="url">josh-rochon.vercel.app</div></div>
</div></body></html>
