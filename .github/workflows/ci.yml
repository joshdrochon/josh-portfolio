name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run build
        env: { SHOW_GALLERY: "1" }
      - run: npm run size
      - run: npm run loc
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          include-hidden-files: true
          retention-days: 1
          path: |
            .next
            !.next/cache

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm run check:locked
        env: { PR_BODY: "${{ github.event.pull_request.body }}" }
      - run: npm run check:scope
        env: { PR_TITLE: "${{ github.event.pull_request.title }}" }

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    # Same image that makes the screenshot baselines (npm run e2e:update), so pixels match.
    container: { image: "mcr.microsoft.com/playwright:v1.65.0-noble", options: --ipc=host }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next }
      - run: npm run test:e2e
        env: { HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }

  perf:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next }
      - run: npx lhci autorun
